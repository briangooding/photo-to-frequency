name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Only the newest plugin is built and shipped, for Windows only. When a new
# version is added, change these three lines.
env:
  PLUGIN_TARGET: PhotoFreq3
  PLUGIN_NAME: Photo Freq 3
  ARTIFACT_NAME: PhotoFreq3-Windows

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: >
          cmake --build build --config Release --parallel 4 --target
          ${PLUGIN_TARGET}_VST3 ${PLUGIN_TARGET}_Standalone ${PLUGIN_TARGET}RenderTest PhotoToFrequencyHostCheck

      - name: Test
        run: |
          build/${PLUGIN_TARGET}RenderTest_artefacts/Release/${PLUGIN_TARGET}RenderTest
          build/PhotoToFrequencyHostCheck_artefacts/Release/PhotoToFrequencyHostCheck \
            "build/${PLUGIN_TARGET}_artefacts/Release/VST3/${PLUGIN_NAME}.vst3"

      - name: Package
        run: |
          mkdir stage
          out="build/${PLUGIN_TARGET}_artefacts/Release"
          cp -R "$out"/VST3/*.vst3 stage/
          cp "$out"/Standalone/*.exe stage/
          ls stage

      # The artifact is the zip itself, so the download has the plugin straight inside.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: stage/
          if-no-files-found: error
